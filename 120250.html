<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球核心资产均线偏离度(乖离率)分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #007bff; --em-red: #df3031; --bg: #f4f6f9; }
        body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 25px; }

        h2 { text-align: center; margin-top: 0; color: #2c3e50; margin-bottom: 25px; }

        /* 搜索控制区 */
        .search-box { 
            background: #f8f9fa; padding: 20px; border-radius: 10px; border: 1px solid #eee;
            display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; justify-content: center; margin-bottom: 20px;
        }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 13px; font-weight: bold; color: #555; }
        
        input, select { padding: 9px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: var(--primary); }
        input { width: 100px; text-transform: uppercase; font-weight: bold; }

        .btn-search { 
            padding: 9px 20px; background: var(--em-red); color: #fff; border: none; border-radius: 6px; 
            font-size: 15px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; height: 38px;
        }
        .btn-search:hover { opacity: 0.9; }

        /* 快捷标签页 */
        .tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid #eee; margin-bottom: 15px; }
        .tab { padding: 8px 15px; cursor: pointer; font-size: 14px; font-weight: bold; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

        .quick-panel { display: none; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
        .quick-panel.active { display: flex; }
        
        .q-btn { 
            background: #fff; border: 1px solid #ddd; color: #444; padding: 6px 14px; 
            border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        .q-btn:hover { border-color: var(--primary); color: var(--primary); background: #f0f7ff; }
        .q-btn.highlight { border-color: #ff9900; color: #d35400; font-weight: bold; background: #fffaf0;}
        .q-btn.sina { border-color: #d81e06; color: #d81e06; background: #fff0f0;}
        .q-btn.sina:hover { background: #d81e06; color: #fff;}

        /* 状态与数据 */
        .status-msg { text-align: center; font-size: 13px; color: #888; margin-bottom: 15px; height: 20px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: #fff; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #eaeaea; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .card-lbl { font-size: 13px; color: #888; margin-bottom: 5px; }
        .card-val { font-size: 24px; font-weight: bold; color: #222; }
        
        .red { color: #df3031; } .green { color: #179c17; }

        /* 图表 */
        .chart-box { position: relative; height: 450px; width: 100%; }
        .loader { position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.9); display: none; justify-content: center; align-items: center; z-index: 10; font-weight: bold; color: var(--em-red);}
    </style>
</head>
<body>

<div class="container">
    <h2>📈 全球核心资产均线偏离度 (乖离率) 分析</h2>

    <!-- 自定义搜索区 -->
    <div class="search-box">
        <div class="input-group">
            <label>代码 (如 TQQQ)</label>
            <input type="text" id="symbol" placeholder="代码" value="TQQQ">
        </div>
        <div class="input-group">
            <label>数据源及市场</label>
            <select id="dataSource">
                <option value="EM_1">东方财富 - 沪市A股/ETF (1)</option>
                <option value="EM_0">东方财富 - 深市A股/ETF (0)</option>
                <option value="EM_116">东方财富 - 港股 (116)</option>
                <option value="EM_105" selected>东方财富 - 美股纳斯达克 (105)</option>
                <option value="EM_106">东方财富 - 美股纽交所 (106)</option>
                <option value="SINA_US">新浪财经 - 美股指数 (直连)</option>
            </select>
        </div>
        <div class="input-group">
            <label>资产属性</label>
            <select id="assetType">
                <option value="1">ETF/个股 (复权)</option>
                <option value="0">指数 (不复权)</option>
            </select>
        </div>
        <div class="input-group">
            <label>时间范围</label>
            <select id="timeLimit">
                <option value="250">最近 1 年</option>
                <option value="1250" selected>最近 5 年</option>
                <option value="2500">最近 10 年</option>
                <option value="100000">全历史</option>
            </select>
        </div>
        <button class="btn-search" onclick="fetchDataFromUI()">🚀 获取数据</button>
    </div>

    <!-- 快捷按键区 -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab('etf')">🌐 跨境ETF与大盘指数</div>
        <div class="tab" onclick="switchTab('us')">🇺🇸 核心美股</div>
        <div class="tab" onclick="switchTab('hk')">🇭🇰 核心港股</div>
        <div class="tab" onclick="switchTab('cn')">🇨🇳 A股核心</div>
    </div>

    <!-- 1. 跨境ETF 与 美股指数 -->
    <div id="panel-etf" class="quick-panel active">
        <!-- 美股大盘指数：走【新浪源 (SINA)】 -->
        <button class="q-btn sina" onclick="quickLoad('SINA', 'US', '.INX', '0', '标普500指数')">标普500 (SPX)</button>
        <button class="q-btn sina" onclick="quickLoad('SINA', 'US', '.IXIC', '0', '纳斯达克综合')">纳指综合 (IXIC)</button>
        <button class="q-btn sina" onclick="quickLoad('SINA', 'US', '.NDX', '0', '纳斯达克100')">纳指100 (NDX)</button>
        <button class="q-btn sina" onclick="quickLoad('SINA', 'US', '.DJI', '0', '道琼斯指数')">道琼斯 (DJI)</button>
        
        <div style="width: 100%; height: 1px; background: #eee; margin: 5px 0;"></div>

        <!-- 跨境ETF与杠杆：走【东财源 (EM)】 -->
        <button class="q-btn highlight" onclick="quickLoad('EM', '105', 'TQQQ', '1', 'TQQQ (三倍做多纳指)')">TQQQ (纳指3倍)</button>
        <button class="q-btn highlight" onclick="quickLoad('EM', '1', '513100', '1', '纳指100 ETF')">纳指100 ETF (513100)</button>
        <button class="q-btn highlight" onclick="quickLoad('EM', '0', '159941', '1', '纳指 ETF')">纳指 ETF (159941)</button>
        <button class="q-btn highlight" onclick="quickLoad('EM', '1', '513300', '1', '纳指科技 ETF')">纳指科技 ETF (513300)</button>
        <button class="q-btn highlight" onclick="quickLoad('EM', '0', '159509', '1', '纳斯达克100 ETF')">纳斯达克100 ETF (159509)</button>
        <button class="q-btn highlight" onclick="quickLoad('EM', '1', '513400', '1', '道琼斯 ETF')">道琼斯 ETF (513400)</button>
        <button class="q-btn highlight" onclick="quickLoad('EM', '1', '513500', '1', '标普500 ETF')">标普500 ETF (513500)</button>
    </div>

    <!-- 2. 美股 -->
    <div id="panel-us" class="quick-panel">
        <button class="q-btn" onclick="quickLoad('EM', '105', 'NVDA', '1', '英伟达')">英伟达 (NVDA)</button>
        <button class="q-btn" onclick="quickLoad('EM', '105', 'AAPL', '1', '苹果')">苹果 (AAPL)</button>
        <button class="q-btn" onclick="quickLoad('EM', '105', 'MSFT', '1', '微软')">微软 (MSFT)</button>
        <button class="q-btn" onclick="quickLoad('EM', '105', 'TSLA', '1', '特斯拉')">特斯拉 (TSLA)</button>
        <button class="q-btn" onclick="quickLoad('EM', '105', 'GOOG', '1', '谷歌')">谷歌 (GOOG)</button>
        <button class="q-btn" onclick="quickLoad('EM', '105', 'AMZN', '1', '亚马逊')">亚马逊 (AMZN)</button>
        <button class="q-btn" onclick="quickLoad('EM', '105', 'META', '1', 'Meta')">Meta (META)</button>
    </div>

    <!-- 3. 港股 -->
    <div id="panel-hk" class="quick-panel">
        <button class="q-btn" onclick="quickLoad('EM', '116', '00700', '1', '腾讯控股')">腾讯控股 (00700)</button>
        <button class="q-btn" onclick="quickLoad('EM', '116', '09988', '1', '阿里巴巴')">阿里巴巴 (09988)</button>
        <button class="q-btn" onclick="quickLoad('EM', '116', '03690', '1', '美团')">美团 (03690)</button>
        <button class="q-btn" onclick="quickLoad('EM', '124', 'HSI', '0', '恒生指数')">恒生指数 (大盘)</button>
    </div>

    <!-- 4. A股 -->
    <div id="panel-cn" class="quick-panel">
        <button class="q-btn" onclick="quickLoad('EM', '1', '000001', '0', '上证指数')">上证指数 (000001)</button>
        <button class="q-btn" onclick="quickLoad('EM', '1', '000300', '0', '沪深300')">沪深300 (000300)</button>
        <button class="q-btn" onclick="quickLoad('EM', '1', '600519', '1', '贵州茅台')">贵州茅台 (600519)</button>
        <button class="q-btn" onclick="quickLoad('EM', '0', '300750', '1', '宁德时代')">宁德时代 (300750)</button>
        <button class="q-btn" onclick="quickLoad('EM', '0', '002594', '1', '比亚迪')">比亚迪 (002594)</button>
    </div>

    <!-- 数据展示区 -->
    <div class="status-msg" id="statusMsg">图表将直观展示当前价格相对 120日线 和 250日线 的偏离幅度。</div>
    
    <div class="stats-grid">
        <div class="card">
            <div class="card-lbl">最新收盘</div>
            <div class="card-val" id="valPrice">-</div>
            <div class="card-lbl" id="valDate" style="font-size:11px; margin-top:3px;">-</div>
        </div>
        <div class="card">
            <div class="card-lbl">当前均线点位</div>
            <div class="card-val" style="font-size: 18px;" id="valMAs">MA120: -<br>MA250: -</div>
        </div>
        <div class="card">
            <div class="card-lbl">MA120 偏离度</div>
            <div class="card-val red" id="valDev120">-</div>
        </div>
        <div class="card">
            <div class="card-lbl">MA250 偏离度</div>
            <div class="card-val red" id="valDev250">-</div>
        </div>
    </div>

    <div class="chart-box">
        <div class="loader" id="loader">正在计算均线偏离度...</div>
        <canvas id="myChart"></canvas>
    </div>
</div>

<script>
    let myChart = null;

    // --- 界面交互 ---
    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.quick-panel').forEach(p => p.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(`panel-${tabName}`).classList.add('active');
    }

    function quickLoad(source, market, symbol, type, assetName) {
        document.getElementById('symbol').value = symbol;
        document.getElementById('assetType').value = type;
        
        if (source === 'SINA') {
            document.getElementById('dataSource').value = 'SINA_US';
        } else {
            document.getElementById('dataSource').value = 'EM_' + market;
        }
        fetchData(source, market, symbol, type, assetName);
    }

    function fetchDataFromUI() {
        const symbol = document.getElementById('symbol').value.toUpperCase().trim();
        const dsValue = document.getElementById('dataSource').value; 
        const type = document.getElementById('assetType').value;
        
        if (!symbol) { alert("请输入代码"); return; }

        if (dsValue === 'SINA_US') {
            let sinaSymbol = symbol;
            if (!sinaSymbol.startsWith('.')) sinaSymbol = '.' + sinaSymbol;
            fetchData('SINA', 'US', sinaSymbol, type, symbol);
        } else {
            const market = dsValue.split('_')[1];
            fetchData('EM', market, symbol, type, symbol);
        }
    }

    // --- 东财引擎 ---
    function jsonpEastmoney(url, callbackName) {
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            const timer = setTimeout(() => { cleanup(); reject(new Error("网络请求超时")); }, 8000);

            function cleanup() {
                delete window[callbackName];
                if (document.body.contains(script)) document.body.removeChild(script);
                clearTimeout(timer);
            }
            window[callbackName] = function(data) { cleanup(); resolve(data); };
            script.src = url;
            script.onerror = () => { cleanup(); reject(new Error("网络连接断开")); };
            document.body.appendChild(script);
        });
    }

    // --- 主请求路由 (数据抓取逻辑一字未改，完全沿用) ---
    async function fetchData(source, market, symbol, type, assetName) {
        const limit = document.getElementById('timeLimit').value;
        const loader = document.getElementById('loader');
        const status = document.getElementById('statusMsg');

        loader.style.display = 'flex';
        status.innerText = `正在分析 ${assetName || symbol}...`;

        // 关键逻辑：多抓取250天数据，用于精准计算期初的MA均线
        const fetchLimit = limit === '100000' ? limit : (parseInt(limit) + 250).toString();

        try {
            if (source === 'SINA') {
                await fetchFromSina(symbol, fetchLimit, assetName, limit);
            } else {
                await fetchFromEastmoney(market, symbol, type, fetchLimit, assetName, limit);
            }
        } catch (err) {
            alert(err.message);
            status.innerText = "❌ 查询失败";
        } finally {
            loader.style.display = 'none';
        }
    }

    // --- 东方财富获取逻辑 ---
    async function fetchFromEastmoney(market, symbol, type, fetchLimit, assetName, originalLimit) {
        const secid = `${market}.${symbol}`;
        const cbName = 'cb_em_' + Date.now() + Math.floor(Math.random() * 100);
        const url = `https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${secid}&fields1=f1,f3&fields2=f51,f53&klt=101&fqt=${type}&end=20500101&lmt=${fetchLimit}&cb=${cbName}&_=${Math.random()}`;

        let res = await jsonpEastmoney(url, cbName);
        
        // 容错重试
        if (!res || !res.data || !res.data.klines) {
            const fallbackType = type === '1' ? '0' : '1'; 
            const cbFallback = 'cb_em_retry_' + Date.now();
            const fallbackUrl = `https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${secid}&fields1=f1,f3&fields2=f51,f53&klt=101&fqt=${fallbackType}&end=20500101&lmt=${fetchLimit}&cb=${cbFallback}&_=${Math.random()}`;
            res = await jsonpEastmoney(fallbackUrl, cbFallback);
        }

        if (!res || !res.data || !res.data.klines) {
            throw new Error(`未找到数据。请检查代码是否正确，或市场是否选对。`);
        }

        const klines = res.data.klines;
        const realName = res.data.name || assetName || symbol;
        
        let dates = [], prices = [];
        klines.forEach(s => {
            const p = s.split(',');
            if (p.length >= 2) {
                const closePrice = parseFloat(p[1]);
                if (!isNaN(closePrice)) {
                    dates.push(p[0]);
                    prices.push(closePrice);
                }
            }
        });

        document.getElementById('statusMsg').innerHTML = `✅ 分析完成: <b>${realName}</b> (计算MA偏离中)`;
        calculateAndDraw(dates, prices, realName, originalLimit);
    }

    // --- 新浪财经直连逻辑 ---
    function fetchFromSina(symbol, fetchLimitStr, assetName, originalLimit) {
        return new Promise((resolve, reject) => {
            const varName = 'sina_' + Date.now() + Math.floor(Math.random() * 100);
            const url = `https://stock.finance.sina.com.cn/usstock/api/jsonp_v2.php/window.${varName}=/US_MinKService.getDailyK?symbol=${symbol}&___=${Math.random()}`;
            
            const script = document.createElement('script');
            const timer = setTimeout(() => { 
                cleanup(); reject(new Error("新浪请求超时")); 
            }, 8000);

            function cleanup() {
                clearTimeout(timer);
                delete window[varName];
                if (document.body.contains(script)) document.body.removeChild(script);
            }

            script.onload = () => {
                const data = window[varName];
                cleanup();
                
                if (data && Array.isArray(data)) {
                    data.sort((a, b) => new Date(a.d) - new Date(b.d));
                    
                    let slicedData = data;
                    if (fetchLimitStr !== '100000') {
                        const limitNum = parseInt(fetchLimitStr);
                        if (data.length > limitNum) slicedData = data.slice(-limitNum);
                    }

                    let dates = [], prices = [];
                    slicedData.forEach(k => {
                        dates.push(k.d);
                        prices.push(parseFloat(k.c));
                    });

                    document.getElementById('statusMsg').innerHTML = `✅ 分析完成: <b>${assetName}</b> (新浪直连)`;
                    calculateAndDraw(dates, prices, assetName, originalLimit);
                    resolve();
                } else {
                    reject(new Error("新浪数据格式异常"));
                }
            };
            script.onerror = () => { cleanup(); reject(new Error("新浪网络断开")); };
            script.src = url;
            document.body.appendChild(script);
        });
    }

    // ===============================================
    // 数据计算与绘图 (均线偏离度算法)
    // ===============================================
    function calculateMA(data, period) {
        let ma = [];
        let sum = 0;
        for (let i = 0; i < data.length; i++) {
            sum += data[i];
            if (i >= period) {
                sum -= data[i - period];
            }
            if (i >= period - 1) {
                ma.push(sum / period);
            } else {
                ma.push(null);
            }
        }
        return ma;
    }

    function calculateAndDraw(fullDates, fullPrices, title, originalLimit) {
        // 1. 在全量数据上计算 MA，确保即便是截取后的数据也有第一天的 MA 
        let ma120 = calculateMA(fullPrices, 120);
        let ma250 = calculateMA(fullPrices, 250);

        let fullDev120 = [];
        let fullDev250 = [];

        // 2. 计算偏离度: (当前价 - MA) / MA * 100
        for (let i = 0; i < fullPrices.length; i++) {
            if (ma120[i] !== null) {
                fullDev120.push(((fullPrices[i] - ma120[i]) / ma120[i]) * 100);
            } else {
                fullDev120.push(null);
            }

            if (ma250[i] !== null) {
                fullDev250.push(((fullPrices[i] - ma250[i]) / ma250[i]) * 100);
            } else {
                fullDev250.push(null);
            }
        }

        // 3. 裁剪数组，只展示用户选择的时间跨度（剥离掉前面多借的 250 天）
        let dates = fullDates;
        let prices = fullPrices;
        let dev120 = fullDev120;
        let dev250 = fullDev250;
        let m120 = ma120;
        let m250 = ma250;

        if (originalLimit !== '100000' && fullDates.length > parseInt(originalLimit)) {
            const cutIdx = fullDates.length - parseInt(originalLimit);
            dates = fullDates.slice(cutIdx);
            prices = fullPrices.slice(cutIdx);
            dev120 = fullDev120.slice(cutIdx);
            dev250 = fullDev250.slice(cutIdx);
            m120 = ma120.slice(cutIdx);
            m250 = ma250.slice(cutIdx);
        }

        // 4. 更新卡片信息
        const last = prices.length - 1;
        document.getElementById('valPrice').innerText = prices[last].toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('valDate').innerText = dates[last];
        
        document.getElementById('valMAs').innerHTML = `MA120: ${m120[last] ? m120[last].toFixed(2) : '-'}<br>MA250: ${m250[last] ? m250[last].toFixed(2) : '-'}`;

        const setVal = (elId, val) => {
            const el = document.getElementById(elId);
            if (val === null || isNaN(val)) {
                el.innerText = "-";
                el.style.color = '#888';
            } else {
                el.innerText = (val > 0 ? "+" : "") + val.toFixed(2) + "%";
                el.style.color = val >= 0 ? '#df3031' : '#179c17';
            }
        };

        setVal('valDev120', dev120[last]);
        setVal('valDev250', dev250[last]);

        // 5. Chart.js 绘图
        const ctx = document.getElementById('myChart').getContext('2d');
        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [
                    {
                        label: '资产价格 (右轴)',
                        data: prices,
                        borderColor: '#2b85e4',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        yAxisID: 'y1'
                    },
                    {
                        label: 'MA120 偏离度 % (左轴)',
                        data: dev120,
                        borderColor: '#ff9800', // 橙色
                        backgroundColor: 'rgba(255, 152, 0, 0.1)',
                        borderWidth: 1.5,
                        fill: false,
                        pointRadius: 0,
                        yAxisID: 'y'
                    },
                    {
                        label: 'MA250 偏离度 % (左轴)',
                        data: dev250,
                        borderColor: '#9c27b0', // 紫色
                        backgroundColor: 'rgba(156, 39, 176, 0.1)',
                        borderWidth: 1.5,
                        fill: false,
                        pointRadius: 0,
                        yAxisID: 'y'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    title: { display: true, text: `${title} - 均线偏离度(乖离率)分析图` },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let val = context.parsed.y;
                                if (context.dataset.label.includes('偏离度')) {
                                    return `${context.dataset.label.split(' ')[0]}: ${(val > 0 ? '+' : '')}${val.toFixed(2)}%`;
                                }
                                return `价格: ${val.toFixed(2)}`;
                            }
                        }
                    }
                },
                scales: {
                    x: { ticks: { maxTicksLimit: 12 } },
                    y: { 
                        type: 'linear', position: 'left', 
                        title: { display: true, text: '偏离幅度 (%)' },
                        grid: { color: (context) => context.tick.value === 0 ? '#333' : '#eee', lineWidth: (context) => context.tick.value === 0 ? 2 : 1 }
                    },
                    y1: { 
                        type: 'linear', position: 'right',
                        grid: { drawOnChartArea: false }
                    }
                }
            }
        });
    }

    // 页面加载完成时，默认加载 TQQQ
    window.onload = () => quickLoad('EM', '105', 'TQQQ', '1', 'TQQQ (纳指3倍)');
</script>
