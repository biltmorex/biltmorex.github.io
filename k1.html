<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凯利公式 & 仓位模拟器 (支持手动调整)</title>
    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #475569;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #ca8a04;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }

        .panel {
            background-color: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            flex: 1;
            min-width: 340px;
        }

        .chart-panel {
            flex: 2;
            min-width: 500px;
            display: flex;
            flex-direction: column;
        }

        h2 { margin-top: 0; color: #0f172a; font-size: 1.4rem; border-bottom: 2px solid var(--border); padding-bottom: 10px;}
        
        .formula {
            background: #e0f2fe; color: #0369a1; padding: 10px; border-radius: 8px;
            text-align: center; font-family: monospace; font-size: 1.2rem; font-weight: bold; margin-bottom: 15px;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        .input-group input {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;
            box-sizing: border-box; font-size: 1rem; transition: border 0.3s;
        }
        .input-group input:focus { outline: none; border-color: var(--primary); }
        .note { font-size: 0.8rem; color: #64748b; margin-top: 5px; }
        
        .flex-row { display: flex; gap: 10px; align-items: center; }

        .btn {
            width: 100%; padding: 12px; background-color: var(--primary); color: white;
            border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; transition: background 0.3s; margin-top: 10px;
        }
        .btn:hover { background-color: #1d4ed8; }
        
        .btn-small {
            padding: 10px 15px; background-color: #e2e8f0; color: var(--secondary);
            border: none; border-radius: 6px; font-size: 0.9rem; cursor: pointer;
            white-space: nowrap; transition: all 0.2s; font-weight: bold;
        }
        .btn-small:hover { background-color: #cbd5e1; color: #0f172a; }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #f1f5f9; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-card .title { font-size: 0.85rem; color: #64748b; margin-bottom: 5px; }
        .stat-card .value { font-size: 1.4rem; font-weight: bold; color: var(--text); }
        
        .val-green { color: var(--success) !important; }
        .val-red { color: var(--danger) !important; }

        .chart-container { position: relative; flex-grow: 1; width: 100%; min-height: 400px; }

        @media (max-width: 768px) {
            .chart-panel { min-width: 100%; }
            .container { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 左侧：参数输入面板 -->
        <div class="panel">
            <h2>1. 赔率与概率设定</h2>
            <div class="formula">理论最佳 f = p/c - q/b</div>

            <div class="input-group">
                <label>胜率 (p):</label>
                <input type="number" id="p" step="0.01" min="0" max="1" value="0.6">
            </div>
            <div class="input-group">
                <label>败率 (q):</label>
                <input type="number" id="q" step="0.01" min="0" max="1" value="0.4">
            </div>
            <div class="input-group">
                <label>失败亏损比例 (c):</label>
                <input type="number" id="c" step="0.01" min="0.01" value="1.0">
            </div>
            <div class="input-group">
                <label>获胜净赔率 (b):</label>
                <input type="number" id="b" step="0.01" min="0.01" value="1.5">
            </div>
            
            <hr style="border:0; border-top:1px solid #e2e8f0; margin: 20px 0;">

            <h2>2. 模拟参数设定</h2>
            <div class="input-group">
                <label>初始本金:</label>
                <input type="number" id="capital" min="1" value="10000">
            </div>
            <div class="input-group">
                <label>模拟轮数:</label>
                <input type="number" id="rounds" min="1" max="10000" value="100">
            </div>
            
            <div class="input-group">
                <label>实际每轮下注仓位比例 (%):</label>
                <div class="flex-row">
                    <input type="number" id="manualF" step="0.1" value="20" style="font-weight: bold; color: var(--primary);">
                    <button class="btn-small" onclick="fillKellyValue()">填入凯利值</button>
                </div>
                <div class="note">参考：当前理论凯利值为 <span id="kellyDisplay" style="font-weight:bold;">--</span></div>
            </div>
            
            <button class="btn" onclick="runSimulation()">开始随机模拟</button>
        </div>

        <!-- 右侧：结果与图表展示面板 -->
        <div class="panel chart-panel">
            <h2>模拟统计结果</h2>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="title">本次使用仓位</div>
                    <div class="value" id="resUsedF">-</div>
                </div>
                <div class="stat-card">
                    <div class="title">最终资金</div>
                    <div class="value" id="resCapital">-</div>
                </div>
                <div class="stat-card">
                    <div class="title">最大回撤 (破产风险)</div>
                    <div class="value" id="resDrawdown">-</div>
                </div>
                <div class="stat-card">
                    <div class="title">胜场 / 败场</div>
                    <div class="value" id="resWinRate">-</div>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="equityChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // DOM 获取
        const inputP = document.getElementById('p');
        const inputQ = document.getElementById('q');
        const inputC = document.getElementById('c');
        const inputB = document.getElementById('b');
        const kellyDisplay = document.getElementById('kellyDisplay');
        const manualFInput = document.getElementById('manualF');
        
        let currentKellyFraction = 0;
        let equityChart = null;

        // 监听参数变化，实时计算理论凯利值
        [inputP, inputQ, inputC, inputB].forEach(input => {
            input.addEventListener('input', calculateTheoreticalKelly);
        });

        // 胜率自动计算败率
        inputP.addEventListener('input', function() {
            let p = parseFloat(this.value);
            if (!isNaN(p) && p >= 0 && p <= 1) {
                inputQ.value = (1 - p).toFixed(4).replace(/\.?0+$/, ''); 
                calculateTheoreticalKelly();
            }
        });

        // 页面加载完毕初始化
        window.onload = () => {
            calculateTheoreticalKelly();
            runSimulation();
        };

        // 计算理论凯利值 (仅显示参考，不强制使用)
        function calculateTheoreticalKelly() {
            const p = parseFloat(inputP.value);
            const q = parseFloat(inputQ.value);
            const c = parseFloat(inputC.value);
            const b = parseFloat(inputB.value);

            if (isNaN(p) || isNaN(q) || isNaN(c) || isNaN(b) || c <= 0 || b <= 0) {
                kellyDisplay.textContent = "参数无效";
                kellyDisplay.style.color = "var(--secondary)";
                currentKellyFraction = 0;
                return;
            }

            currentKellyFraction = (p / c) - (q / b);
            
            if (currentKellyFraction > 0) {
                kellyDisplay.textContent = (currentKellyFraction * 100).toFixed(2) + '%';
                kellyDisplay.style.color = "var(--success)";
            } else {
                kellyDisplay.textContent = (currentKellyFraction * 100).toFixed(2) + '% (期望为负)';
                kellyDisplay.style.color = "var(--danger)";
            }
        }

        // 快捷填入理论凯利值到手动输入框
        function fillKellyValue() {
            if (currentKellyFraction > 0) {
                manualFInput.value = (currentKellyFraction * 100).toFixed(2);
            } else {
                alert("当前理论凯利值 ≤ 0 (属于负收益预期)，不建议按此比例投资。");
            }
        }

        // 核心：蒙特卡洛模拟
        function runSimulation() {
            const p = parseFloat(inputP.value);
            const c = parseFloat(inputC.value);
            const b = parseFloat(inputB.value);
            const initialCapital = parseFloat(document.getElementById('capital').value);
            const rounds = parseInt(document.getElementById('rounds').value);
            
            // 获取用户手动输入的仓位百分比，并转换为小数
            const actualFPercentage = parseFloat(manualFInput.value);
            const f = actualFPercentage / 100;

            if (isNaN(f) || f <= 0) {
                alert("请输入大于 0 的实际仓位比例！");
                return;
            }

            let capital = initialCapital;
            let capitalHistory = [initialCapital];
            let labels = [0];
            
            let peak = initialCapital;
            let maxDrawdown = 0;
            let wins = 0;
            let losses = 0;

            // 模拟每一轮
            for (let i = 1; i <= rounds; i++) {
                let bet = capital * f; // 根据你手动填写的比例下注
                let rand = Math.random(); // 抛骰子
                
                if (rand <= p) {
                    capital += bet * b; // 赢
                    wins++;
                } else {
                    capital -= bet * c; // 输
                    losses++;
                }

                // 极简破产判定
                if (capital <= 0.01) {
                    capital = 0;
                    capitalHistory.push(capital);
                    labels.push(i);
                    break;
                }

                capitalHistory.push(capital);
                labels.push(i);

                if (capital > peak) { peak = capital; }
                let currentDrawdown = (peak - capital) / peak;
                if (currentDrawdown > maxDrawdown) { maxDrawdown = currentDrawdown; }
            }

            // 更新面板数据
            document.getElementById('resUsedF').textContent = actualFPercentage + '%';
            
            const finalCapEl = document.getElementById('resCapital');
            finalCapEl.textContent = capital.toFixed(2);
            finalCapEl.className = capital >= initialCapital ? "value val-green" : "value val-red";

            // 如果破产，最大回撤直接显示 100%
            let displayDrawdown = capital === 0 ? 100 : (maxDrawdown * 100);
            const drawdownEl = document.getElementById('resDrawdown');
            drawdownEl.textContent = displayDrawdown.toFixed(2) + '%';
            drawdownEl.className = displayDrawdown > 50 ? "value val-red" : "value";

            document.getElementById('resWinRate').textContent = `${wins}胜 / ${losses}负`;

            // 绘制图表
            drawChart(labels, capitalHistory, initialCapital);
        }

        function drawChart(labels, data, initialCapital) {
            const ctx = document.getElementById('equityChart').getContext('2d');
            
            if (equityChart) { equityChart.destroy(); }

            const isBankrupt = data[data.length - 1] === 0;
            const isProfit = data[data.length - 1] >= initialCapital;
            
            // 颜色逻辑：破产红色、盈利绿色、亏损但未破产橙色
            let lineColor = isProfit ? '#16a34a' : (isBankrupt ? '#dc2626' : '#ca8a04');
            let bgColor = isProfit ? 'rgba(22, 163, 74, 0.1)' : (isBankrupt ? 'rgba(220, 38, 38, 0.1)' : 'rgba(202, 138, 4, 0.1)');

            equityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '账户总资金',
                        data: data,
                        borderColor: lineColor,
                        backgroundColor: bgColor,
                        borderWidth: 2,
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { intersect: false, mode: 'index' },
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { title: { display: true, text: '轮数' } },
                        y: { title: { display: true, text: '资金量' }, beginAtZero: true }
                    }
                }
            });
        }
    </script>
</body>
</html>
